[project]
name = "typesafe-tpm-mcp"
version = "0.1.0"
description = "MCP server that gates ticket quality with TypeSafe jev before agent execution"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "typesafe-sdk>=0.6.0",
    "pydantic>=2.12",
]

[project.scripts]
typesafe-tpm-mcp = "typesafe_tpm_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typesafe_tpm_mcp"]
